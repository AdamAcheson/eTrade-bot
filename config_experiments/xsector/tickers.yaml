# EXPERIMENT UNIVERSE -- cross-sector, deliberately low-correlation.
#
# This file is NOT loaded by the live bot or by a default backtest. It exists so
# scripts/backtest.py --config-dir config_experiments/xsector can answer one
# question: the mining universe's effective breadth is far below its nominal
# ticker count because the names all move together, and IR = IC x sqrt(breadth),
# so does running the SAME strategy on names that do not move together raise the
# information ratio?
#
# strategy.yaml / risk.yaml / broker.yaml / schedule.yaml in this directory are
# symlinks back to config/, so every parameter is identical to the shipped mining
# config and the universe is the only variable.
#
# profit_target_pct is derived mechanically, not chosen: [0.58, 1.11] x each
# name's own median daily range, which are the median ratios the shipped mining
# config already uses. volatility_category is bucketed on the same measurement.
# Nothing here was picked by looking at P&L.

tickers:
  AMD:
    benchmark: SMH
    sector: semiconductors
    max_spread_pct: 0.15
    overnight_category: normal
    overnight_position_multiplier: 1.0
    manual_only: false
    profit_target_pct: [2.5, 5.0]
    volatility_category: normal
    # median daily range 4.42%, median close $421.22, median $vol $10849M

