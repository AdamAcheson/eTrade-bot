# EXPERIMENT UNIVERSE -- the shipped mining universe PLUS the cross-sector names.
#
# Generated: do not hand-edit. Regenerate by concatenating config/tickers.yaml
# with config_experiments/xsector/tickers.yaml (see docs/BACKTEST_RESULTS.md,
# "Uncorrelated universe test").
#
# This is the actionable form of the breadth question. Running the strategy on
# cross-sector names ALONE only asks whether it travels. Running both books
# together asks whether adding low-correlation names to the existing one raises
# the information ratio -- which is the change a desk would actually make.
#
# Note what caps the answer: behavior.max_concurrent_positions is 5. Thirty-six
# names cannot place more simultaneous bets than five slots allow, so a combined
# run measures breadth AND slot contention at once.

