# Strategy parameters. See docs/ARCHITECTURE.md section 5 for schema notes.

candle_timeframe: 5m   # architecture supports adding 1m later without changing the schema

indicators:
  ema_fast: 9
  ema_slow: 20
  atr_period: 14

eligibility:
  # RVOL threshold: today's cumulative volume-so-far must be at least this many
  # times the same point-in-time historical average. Lowered from 1.20 (20% above
  # average) to admit more candidates, per user decision after reviewing the 60-day
  # backtest's rejection-reason breakdown (REJECTED_LOW_VOLUME was a meaningful
  # contributor).
  min_relative_volume: 1.10
  # Stock's own price must be above its 9EMA to enter. Separate from
  # benchmark_confirmation.require_ema_alignment below (that one gates the
  # benchmark, this one gates the stock) -- previously this side had no config
  # toggle at all and was rejecting almost as often as REJECTED_DATA_QUALITY in the
  # 60-day backtest. Disabled here for the same reason the benchmark-side check
  # was already dropped: it isn't the bottleneck we want (see min_trend_pct below
  # for the actual "too few trades in a trending sector" fix).
  require_ema_alignment: false

chase_rule:
  max_consecutive_large_green_candles: 3
  large_candle_body_atr_multiple: 1.0
  max_atr_above_vwap: 1.0
  max_pct_above_open_without_consolidation: 5.0

benchmark_confirmation:
  require_price_above_vwap: true
  # Benchmark may trade up to this % below its own VWAP and still confirm, instead
  # of requiring strictly above -- softens noise right around the line without
  # dropping the VWAP check entirely. 0.0 = original strict behavior.
  vwap_tolerance_pct: 0.15
  require_ema_alignment: false
  require_no_fresh_intraday_low: true
  # Second, independent way to satisfy require_price_above_vwap: even when the
  # benchmark is below TODAY's VWAP, it still confirms if it's at least this % above
  # the PRIOR session's close. VWAP resets every morning, so a sector genuinely
  # trending up over days/weeks (mining, per the user's read of the tape) can still
  # read "below VWAP" for large stretches of any single day -- this catches that
  # multi-day trend instead of only same-day price action. 0.0 disables this path
  # (original VWAP-only behavior). 0.3 is a starting point, not a backtested
  # optimum -- re-tune after seeing its effect on trade count and win rate.
  min_trend_pct: 0.3

setups:
  # ORB_PULLBACK_CONTINUATION is the setup this strategy was originally designed
  # around; VWAP_RECLAIM is the fallback tried only when it doesn't match. Now
  # DISABLED: once a confirmation-window bug that had been starving ORB of matches
  # was fixed (it required the confirmation candle to be the single most-recently-
  # closed bar), ORB finally got a real sample -- and lost money. Over 183 trading
  # days: ORB 47 trades, 12.8% win rate, -$2,092.83; VWAP_RECLAIM 89 trades, 22.5%
  # win rate, +$5,736.72. Disabling ORB took the portfolio from +$3,643.88 to
  # +$7,904.23, half from removing ORB's own losses and half from un-blocking 29
  # VWAP_RECLAIM trades it had been crowding out (max_concurrent_positions is 1,
  # so a mediocre setup does not merely underperform -- it displaces better ones).
  # Set true to re-enable; scripts/backtest.py --disable-orb overrides either way.
  enable_orb_pullback: false
  opening_range_minutes: 10
  pullback_max_atr_from_breakout: 1.0
  vwap_reclaim_lookback_bars: 6

reward_risk:
  minimum_r: 1.5
  preferred_r_min: 1.75
  # When true, ignores each ticker's fixed profit_target_pct and always targets
  # preferred_r_min x the ACTUAL stop distance instead -- so widening the stop
  # (e.g. via risk.yaml's stops.atr_multiplier) doesn't silently shrink the
  # R-ratio by leaving the target fixed while risk grows. false preserves the
  # original fixed-%-target behavior.
  scale_target_with_stop: false

scoring:
  weights:
    benchmark_strength: 20
    relative_volume: 15
    price_vs_vwap: 10
    ema_alignment: 10
    opening_range_structure: 15
    pullback_quality: 10
    risk_reward: 10
    spread_liquidity: 5
    sector_strength: 5
  minimum_entry_score:
    primary_window: 70
    midday_window: 80

trade_management:
  breakeven_trigger_r: 1.0
  # A real ratcheting stop, trailed atr_multiplier x ATR under the trade's
  # high-water mark once it reaches activate_at_r. breakeven_trigger_r above only
  # ever moves the stop to the entry price, once -- so a trade that runs up and
  # retraces exits at exactly $0.00. Default off: enabling it changes exit
  # behavior on every trade, so it has to be justified by a backtest, not assumed.
  trailing_stop:
    enabled: true
    atr_multiplier: 1.0
    activate_at_r: 1.0
  partial_exit:
    enabled: true
    trigger_r: 1.5
    sell_fraction: 0.35
