# Risk / money-management parameters. See docs/ARCHITECTURE.md section 6.
# Nothing here is a final production setting -- these are paper-trading defaults meant
# to be swept/tested via the daily/cumulative reports (spec section 15/16).

account:
  max_account_risk_per_trade: 0.0075   # 0.75% of equity per trade
  # Overrides max_account_risk_per_trade with a flat dollar loss cap per trade
  # instead of a % of equity when set -- lets a wider stop be tested without risk
  # scaling with account size. null (default) preserves %-of-equity sizing.
  max_risk_dollars_per_trade: null

sizing:
  max_position_size_dollars: 25000
  max_position_size_pct_equity: 0.25

stops:
  atr_multiplier:
    low_volatility_diversified: 0.75
    normal: 0.85
    high_volatility_speculative: 0.95
  # Floor on stop distance, as a percent of entry price. ATR here is a 14-period
  # average of FIVE-MINUTE bars, so it measures roughly the last 70 minutes and
  # collapses in a quiet afternoon -- without a floor it can place a stop inside
  # the instrument's ordinary noise band (0.22% of price on CDE, 2026-09-17,
  # against a 5.09% median daily range). Applied as a third candidate beside the
  # ATR and structure stops, widest wins, so it never tightens a stop.
  # 0.5 is roughly 0.1x daily ATR for this universe. See docs/BACKTEST_RESULTS.md:
  # raises holdout net 17% with the runner tail intact, at the cost of a slightly
  # worse median day and ~0.4pp more drawdown.
  min_stop_pct_of_price: 0.5

safety:
  # Raised from 3 alongside max_concurrent_positions below. Counterintuitively this
  # cap was not limiting risk: with 5 slots and a cap of 3 the backtest's drawdown
  # got WORSE (3.1% vs 2.5%), because the cap fills the day's slots with the first
  # signals to arrive rather than leaving room for later ones.
  max_trades_per_day: 15
  max_daily_loss_pct: 0.02
  max_consecutive_losses: 2
  max_position_size_dollars: 25000
  max_slippage_pct: 0.10
  max_spread_pct_default: 0.25
  data_staleness_limit_seconds: 30
  broker_connection_check_interval_seconds: 15
  ticker_cooldown_after_stop_minutes: 45
  # Hard force-exit at current price after this many calendar days, regardless of
  # the daily overnight-eligibility review. null (default) disables it -- positions
  # are then only ever closed by stop/target/trailing-stop/overnight-review, with
  # no hold-time ceiling.
  max_hold_days: null

behavior:
  averaging_down: false
  pyramiding: false
  # 5, not 1: ~90% of qualifying signals were being rejected purely because the
  # single slot was already occupied, and the crowded-out signals backtest as well
  # as the taken ones (1 -> 5 slots: +39% net P&L for +0.3pp drawdown). Gains flatten
  # past 5 -- 8 slots added only $571 more over the same 183 days.
  # NOTE: 5 open positions in this universe is closer to one bet than five. On
  # 2026-02-26 every ticker fell 32-41% together.
  max_concurrent_positions: 5

overnight:
  default_position_multiplier: 1.0
  reduced_position_multiplier: 0.50
  # When false, a position can be held past the 3:50pm review while currently below
  # entry price, as long as every other thesis check (benchmark trend, structure,
  # volume, selling pressure) still passes. Only sound to disable alongside a
  # stop/sizing regime (like max_risk_dollars_per_trade above) that already bounds
  # the dollar loss if the thesis turns out wrong. true (default) preserves the
  # original same-day-or-better requirement.
  require_at_or_above_entry: true

emergency:
  kill_switch_enabled: true
  kill_switch_file: "logs/KILL_SWITCH"
