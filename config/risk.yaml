# Risk / money-management parameters. See docs/ARCHITECTURE.md section 6.
# Nothing here is a final production setting -- these are paper-trading defaults meant
# to be swept/tested via the daily/cumulative reports (spec section 15/16).

account:
  max_account_risk_per_trade: 0.0075   # 0.75% of equity per trade
  # Overrides max_account_risk_per_trade with a flat dollar loss cap per trade
  # instead of a % of equity when set -- lets a wider stop be tested without risk
  # scaling with account size. null (default) preserves %-of-equity sizing.
  max_risk_dollars_per_trade: null

# Sized for the live account as chosen 2026-09-23: $5,000, CASH ONLY, no borrowing,
# $2,500 per trade, two at a time. At $5,000 the notional cap and the 50%-of-equity
# cap agree at $2,500; below $5,000 the percentage takes over, so two positions
# never add up to more than the account.
sizing:
  max_position_size_dollars: 2500
  max_position_size_pct_equity: 0.5
  # Never hold more than the account is worth: every open position, at cost, plus the
  # new one, stays within this fraction of equity. 1.0 = no borrowing. This is the
  # check that keeps the paper account honest -- IBKR's paper account reports $20,000
  # of buying power on $5,000 and would happily fill orders the real cash account
  # could not. null disables it.
  max_total_exposure_pct_equity: 1.0
  # SETTLED CASH ONLY. IBKR confirmed (2026-09-23) the account "operates like a cash
  # account - you can only trade with settled cash". Sale proceeds settle the next
  # business day, so total purchases per day are capped at the equity the day started
  # with: on $5,000 at $2,500 a trade, two entries a day and no more, even after both
  # have closed. Buying with unsettled money and selling before it settles is a good
  # faith violation. null disables it (a margin account would).
  max_daily_purchases_pct_equity: 1.0
  # If the two cash rules above would shrink a trade below this fraction of its
  # intended size, skip it rather than open a sliver (two $2,492.60 buys leave $14.80,
  # which would otherwise buy one share of a third stock nearly every day).
  min_trimmed_fraction: 0.5

stops:
  atr_multiplier:
    low_volatility_diversified: 0.75
    normal: 0.85
    high_volatility_speculative: 0.95
  # Floor on stop distance, as a percent of entry price. ATR here is a 14-period
  # average of FIVE-MINUTE bars, so it measures roughly the last 70 minutes and
  # collapses in a quiet afternoon -- without a floor it can place a stop inside
  # the instrument's ordinary noise band (0.22% of price on CDE, 2026-09-17,
  # against a 5.09% median daily range). Applied as a third candidate beside the
  # ATR and structure stops, widest wins, so it never tightens a stop.
  # 0.5 is roughly 0.1x daily ATR for this universe. See docs/BACKTEST_RESULTS.md:
  # raises holdout net 17% with the runner tail intact, at the cost of a slightly
  # worse median day and ~0.4pp more drawdown.
  min_stop_pct_of_price: 0.5

safety:
  # Raised from 3 alongside max_concurrent_positions below. Counterintuitively this
  # cap was not limiting risk: with 5 slots and a cap of 3 the backtest's drawdown
  # got WORSE (3.1% vs 2.5%), because the cap fills the day's slots with the first
  # signals to arrive rather than leaving room for later ones.
  max_trades_per_day: 15
  max_daily_loss_pct: 0.02
  max_consecutive_losses: 2
  max_position_size_dollars: 2500
  max_slippage_pct: 0.10
  max_spread_pct_default: 0.25
  data_staleness_limit_seconds: 30
  broker_connection_check_interval_seconds: 15
  ticker_cooldown_after_stop_minutes: 45
  # Hard force-exit at current price after this many calendar days, regardless of
  # the daily overnight-eligibility review. null (default) disables it -- positions
  # are then only ever closed by stop/target/trailing-stop/overnight-review, with
  # no hold-time ceiling.
  max_hold_days: null

behavior:
  averaging_down: false
  pyramiding: false
  # 2: two $2,500 positions fill a $5,000 cash account with no borrowing.
  # History: raised 1 -> 5 when positions were small relative to the account (~90% of
  # qualifying signals were being rejected purely because the single slot was taken;
  # 1 -> 5 slots gave +39% net for +0.3pp drawdown). Five slots at $2,000 needs $10,000,
  # i.e. borrowing, which the live account will not do. Simulated on the holdout with
  # no borrowing: $2,500 x 2 netted about $2,800-2,900, the best of the sizes tried.
  # NOTE: even two open positions in this universe are close to one bet. On
  # 2026-02-26 every ticker fell 32-41% together.
  max_concurrent_positions: 2

overnight:
  default_position_multiplier: 1.0
  reduced_position_multiplier: 0.50
  # When false, a position can be held past the 3:50pm review while currently below
  # entry price, as long as every other thesis check (benchmark trend, structure,
  # volume, selling pressure) still passes. Only sound to disable alongside a
  # stop/sizing regime (like max_risk_dollars_per_trade above) that already bounds
  # the dollar loss if the thesis turns out wrong. true (default) preserves the
  # original same-day-or-better requirement.
  require_at_or_above_entry: true

emergency:
  kill_switch_enabled: true
  kill_switch_file: "logs/KILL_SWITCH"

# --- transaction costs -------------------------------------------------------
# Modelled per SHARE, not in basis points, because the binding constraint is the
# one-cent minimum tick: crossing a penny-wide market costs half a cent per share
# whatever the price, which is 0.5 bps on a $95 stock and 12 bps on a $4 one. Over
# half this strategy's traded notional sits in sub-$10 miners.
#
# These defaults are a FLOOR on real cost, not an estimate of it:
#   spread_ticks 1.0 is the tightest a US equity quote can legally be
#   impact_bps 0.0 assumes a $25k order moves the book not at all
#   commission 0.0 is correct for E*TRADE on US equities
# See docs/BACKTEST_RESULTS.md -- even at this floor the strategy's edge is thin.
transaction_costs:
  spread_ticks: 1.0
  impact_bps: 0.0
  commission_per_order: 0.0
  # 1.0 = every fill crosses the spread. Exits always do (submit_exit_order sends
  # a marketable limit); assuming entries rest passively without adverse selection
  # would be optimistic for a momentum strategy, so this stays at 1.0.
  crossing_fraction: 1.0
