# Broker selection. See docs/ARCHITECTURE.md section 7 and section 11 ("what could ever
# place a real order"). config_loader.py raises a ConfigError at startup unless mode
# is "paper" or "sandbox" -- "live"/production is not implemented anywhere in this
# codebase, and switching mode alone can never reach it.

mode: paper   # paper (default, fully simulated) | sandbox (real E*TRADE sandbox API,
              # fake sandbox money) | ibkr_paper (Interactive Brokers PAPER account
              # through TWS on this computer) | live -- "live" always raises at startup.

# Independent of `mode` above: where does market data (quotes/bars) come from?
#   memory (default) -- InMemoryMarketDataProvider; nothing arrives unless a caller
#                        (tests, a backtest driver) explicitly pushes bars/quotes.
#   ibkr              -- IBKRMarketDataProvider streams 5-minute bars and quotes from
#                         TWS (data/ibkr_market_data.py). Live where the account has a
#                         data subscription, 15-minute DELAYED otherwise. Same paper-port
#                         check as mode: ibkr_paper. `scripts/run_bot.py --ibkr-paper`
#                         sets this and mode: ibkr_paper for one run.
#   etrade            -- ETradeMarketDataProvider polls E*TRADE's real quote endpoint
#                         and builds bars from it (see data/etrade_market_data.py).
#                         Requires etrade.environment: sandbox below, same as
#                         mode: sandbox does -- this is checked independently.
# `mode: paper` + `market_data_source: etrade` is the useful combo for watching the
# strategy evaluate real (sandbox) quotes while still using the local simulated
# broker for fills/P&L bookkeeping, since E*TRADE's sandbox itself does not
# realistically track order/position state (see docs/ARCHITECTURE.md section 11).
market_data_source: memory   # memory | ibkr | etrade

paper:
  starting_equity: 5000   # matches the live cash account and the IBKR paper account
  fill_model: touch   # a resting limit order fills once the quote touches/crosses it

etrade:
  # broker/etrade.py (ETradeBrokerAdapter) implements real HTTP calls to E*TRADE's
  # SANDBOX API ONLY -- its constructor raises ETradeSafetyError if
  # etrade.environment is anything other than "sandbox". Nothing in this codebase
  # can reach api.etrade.com (production). To actually use it: set `mode: sandbox`
  # above, run scripts/etrade_authorize.py once to obtain an access token, and put
  # all five credential values in your local .env (see .env.example) -- never here.
  # Credentials are never stored in this file -- only the NAMES of the environment
  # variables that hold them.
  environment: sandbox   # sandbox | production -- "production" is never accepted
  consumer_key_env: ETRADE_SANDBOX_CONSUMER_KEY
  consumer_secret_env: ETRADE_SANDBOX_CONSUMER_SECRET
  oauth_token_env: ETRADE_SANDBOX_OAUTH_TOKEN
  oauth_token_secret_env: ETRADE_SANDBOX_OAUTH_TOKEN_SECRET
  account_id_env: ETRADE_SANDBOX_ACCOUNT_ID

ibkr:
  # broker/ibkr.py (IBKRPaperBrokerAdapter), used when mode: ibkr_paper. PAPER ONLY:
  # the port must be a paper port and the host this computer (both checked at
  # startup), and the adapter refuses to run unless every account TWS reports is a
  # paper account (id starting "DU"). In TWS: Global Configuration > API > Settings,
  # tick "Enable ActiveX and Socket Clients", UNtick "Read-Only API", keep
  # "Allow connections from localhost only" ticked.
  host: 127.0.0.1
  port: 7497              # 7497 TWS paper | 4002 IB Gateway paper
  client_id: 21           # any number not used by another program connected to TWS
  account_id: ""          # optional; if set, must match the paper account (DU...)
  # The bot's orders are marketable limits meant to fill now. Wait this long for a
  # fill, then cancel whatever is left, so nothing rests unwatched at the broker.
  fill_timeout_seconds: 10
  cancel_timeout_seconds: 5

# Real brokers only (the simulator always fills). An exit sell that has not fully
# filled is re-sent this many percent below the bid, in turn, until it fills.
# 0.0 = at the bid. Anything still unsold after the last step is reported loudly and
# left for the user to close; the bot will not open a new trade in that stock.
exit_retry_steps_pct: [0.0, 0.25, 0.75]
