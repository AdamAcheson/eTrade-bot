  # --- Added by request 2026-09-16 -----------------------------------------
  # Nine names added in one batch. profit_target_pct is derived, not chosen:
  # [0.58, 1.11] x each name's own median daily range, the median ratios the rest
  # of this file already embodies.
  #
  # Five are marked strategy: excluded on a LIQUIDITY screen applied to the bars
  # BEFORE any backtest, for a reason the backtest cannot discover on its own:
  # scripts/backtest.py synthesizes bid/ask as 30% of each ticker's configured
  # max_spread_pct (see its module docstring), so the spread gate can never reject
  # anything in a backtest and an untradeable name reports clean profits. TRX at
  # $0.40 would carry a 1-cent real spread -- 2.5% -- against the ~0.045% the
  # backtest would assume. Those numbers are fiction, so they are not evidence.
  #
  # The bar: median >= 74 of 78 five-minute bars printed per day, and median daily
  # dollar volume >= $5M. Reference points already in this file -- the weakest
  # ENABLED name is VZLA (78 bars, $5.7M); NEXA was EXCLUDED at 37 bars, $0.3M.

  GFI:
    benchmark: GDX
    sector: gold_miner
    max_spread_pct: 0.15
    overnight_category: normal
    overnight_position_multiplier: 1.0
    manual_only: false
    profit_target_pct: [1.5, 3.0]
    volatility_category: normal
    # 78/78 bars/day (100%), $67.9M median daily $vol, $20.04 median close, 2.89% median range, from 2023-09-05
    # Excluded 2026-09-16 and RESTORED the same day. The drop was measured and
    # did not hold up: the holdout's drawdown rose 4.93% -> 5.41% for +$462 of net
    # (return/DD 15.7 -> 14.4), and the tuning period -- the window that motivated
    # the drop -- got WORSE by $1,784 despite removing $903 of losses, because the
    # freed position slots filled with worse trades. Low trade count (38 holdout,
    # 21 tuning) is why its P&L flips sign between periods, not a reason to cut it.

  HMY:
    benchmark: GDX
    sector: gold_miner
    max_spread_pct: 0.15
    overnight_category: normal
    overnight_position_multiplier: 1.0
    manual_only: false
    profit_target_pct: [2.0, 3.5]
    volatility_category: normal
    # 78/78 bars/day (100%), $47.3M median daily $vol, $12.16 median close, 3.18% median range, from 2023-09-05
